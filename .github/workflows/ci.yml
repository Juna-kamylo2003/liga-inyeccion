name: CI/CD Complete Pipeline

on:
  push:
    branches:
      - develop
      - integration
      - 'feature/*'
  pull_request:
    branches:
      - develop
      - integration

jobs:
  test:
    name: Test (${{ matrix.environment }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        environment: [development, test]
        include:
          - environment: development
            db_name: ligas_db
            db_user: dev_user
            db_password: dev_password
          - environment: test
            db_name: ligas_db_test
            db_user: test_user
            db_password: test_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ${{ matrix.db_name }}
          MYSQL_USER: ${{ matrix.db_user }}
          MYSQL_PASSWORD: ${{ matrix.db_password }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {30..0}; do
            if mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent; then
              break
            fi
            echo 'MySQL is unavailable - sleeping'
            sleep 1
          done

      - name: Run database migrations
        run: npx sequelize-cli db:migrate
        env:
          NODE_ENV: ${{ matrix.environment }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ matrix.db_name }}
          DB_USERNAME: ${{ matrix.db_user }}
          DB_PASSWORD: ${{ matrix.db_password }}
          DB_DIALECT: mysql
          CI: true

      - name: Check database tables
        run: |
          echo "Checking if tables were created in ${{ matrix.db_name }}..."
          mysql -h127.0.0.1 -P3306 -uroot -proot ${{ matrix.db_name }} -e "SHOW TABLES;"
          echo "Checking Usuario table structure..."
          mysql -h127.0.0.1 -P3306 -uroot -proot ${{ matrix.db_name }} -e "DESCRIBE Usuarios;" || echo "Usuarios table does not exist"

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: ${{ matrix.environment }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ matrix.db_name }}
          DB_USERNAME: ${{ matrix.db_user }}
          DB_PASSWORD: ${{ matrix.db_password }}
          DB_DIALECT: mysql
          CI: true

  deploy-check:
    name: Verify deployment readiness
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: |
          echo "Building application for deployment..."
          npm run build --if-present
          
      - name: Check package.json
        run: |
          echo "Verifying package.json configuration..."
          cat package.json | jq '.scripts, .dependencies' || echo "No jq available, showing raw package.json"
          cat package.json
          
      - name: Deployment ready ✅
        run: |
          echo "🚀 Application is ready for deployment!"
          echo "✅ All tests passed in both development and test environments"
          echo "✅ Dependencies installed successfully" 
          echo "✅ Application built successfully"
